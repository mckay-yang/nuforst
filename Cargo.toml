[workspace]
resolver = "2"
members = [
    "crates/gdal",
    "crates/nufrost-core",
    "crates/hants-core",
    "crates/hapo-core",
    "crates/zhu2015-core",
    "crates/nufrost-cli",
]

[workspace.dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
gdal-rs = { package = "gdal", version = "0.19" }
regex = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

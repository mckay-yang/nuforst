[package]
name = "nufrost-paper-reproduction"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace]
resolver = "2"
members = ["crates/nufrost-core"]

[dependencies]
nufrost-core = { package = "nufrost-paper-core", path = "crates/nufrost-core" }
hants-core = { path = "../../crates/hants-core" }
zhu2015-core = { path = "../../crates/zhu2015-core" }
gdal = { path = "../../crates/gdal" }
anyhow = "1"
memmap2 = "0.9"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
